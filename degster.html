<style>
:root{--bg:#070A13;--bg2:#101727;--card:#151F32;--a:#4B8BFF;--c:#00D9FF;--p:#916BFF;--t:#F8FAFC;--m:#A3B2C8;--ok:#22C55E;--bad:#EF4444;--ln:rgba(148,163,184,.16);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:flex;color:var(--t);font:15px/1.55 Manrope,system-ui,sans-serif;background:radial-gradient(800px 480px at 90% -10%,rgba(139,92,246,.2),transparent),radial-gradient(700px 500px at 0 0,rgba(77,141,255,.14),transparent),var(--bg)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(var(--ln) 1px,transparent 1px) 0 0/52px 52px,linear-gradient(90deg,var(--ln) 1px,transparent 1px) 0 0/52px 52px;opacity:.35;-webkit-mask-image:radial-gradient(ellipse at 50% 0,#000,transparent 70%);mask-image:radial-gradient(ellipse at 50% 0,#000,transparent 70%)}
h1,h2,h3{font-family:Manrope,system-ui,sans-serif;margin:0 0 .5rem;line-height:1.2}h1{font-size:1.7rem}h2{font-size:1.1rem}
nav{position:relative;z-index:1;width:236px;flex:none;background:rgba(16,23,39,.85);border-right:1px solid var(--ln);padding:1rem .6rem;overflow:auto;transition:width .2s}

.lg{font:700 1.05rem Manrope;padding:.2rem .6rem 1rem;display:flex;gap:.5rem;align-items:center;letter-spacing:.04em}.lg i{color:var(--c)}

nav button:hover{color:var(--t);background:rgba(77,141,255,.1)}nav button.on{color:var(--t);background:linear-gradient(90deg,rgba(77,141,255,.25),rgba(139,92,246,.12));box-shadow:inset 2px 0 var(--c)}

@keyframes in{from{opacity:0;transform:translateY(6px)}}
.card{background:linear-gradient(135deg,rgba(255,255,255,.06),transparent 38%),rgba(18,30,55,.65);backdrop-filter:blur(14px);border:1px solid var(--ln);border-radius:16px;padding:1.1rem;margin:0 0 1rem}
.hot{border-color:rgba(0,212,255,.35);box-shadow:0 0 28px rgba(77,141,255,.12)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem}.grid .card{margin:0}
.big{font:700 1.9rem Manrope}.m{color:var(--m);font-size:.88rem}.de{font:600 1.5rem Manrope}
.b{font:inherit;font-weight:500;color:#fff;background:linear-gradient(135deg,var(--a),var(--p));border:0;border-radius:10px;padding:.6rem 1rem;cursor:pointer;margin:.2rem .3rem .2rem 0;transition:transform .1s,filter .15s}
.b:hover{filter:brightness(1.12)}.b:active{transform:scale(.97)}.b.s{background:transparent;border:1px solid var(--ln);color:var(--t)}.b.s:hover{border-color:var(--c)}
.opt{display:block;width:100%;text-align:left;margin:.35rem 0;background:rgba(8,11,20,.5);color:var(--t);border:1px solid var(--ln);border-radius:10px;padding:.65rem .8rem;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--a)}.opt.ok{border-color:var(--ok);background:rgba(34,197,94,.12)}.opt.no{border-color:var(--bad);background:rgba(239,68,68,.12)}
input,textarea,select{width:100%;font:inherit;color:var(--t);background:rgba(8,11,20,.6);border:1px solid var(--ln);border-radius:10px;padding:.55rem .7rem;margin:.2rem 0 .8rem}
label{font-size:.85rem;color:var(--m)}
:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.bar{height:8px;background:rgba(148,163,184,.18);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--c));border-radius:6px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.chip{display:inline-block;padding:.2rem .6rem;border:1px solid var(--ln);border-radius:20px;font-size:.8rem;margin:.15rem;color:var(--m)}
.orb{width:84px;height:84px;border-radius:50%;margin:.4rem auto;background:radial-gradient(circle at 35% 30%,var(--c),var(--a) 45%,var(--p));box-shadow:0 0 34px rgba(77,141,255,.35)}.orb.on{animation:pu 1.1s ease-in-out infinite}
@keyframes pu{50%{transform:scale(1.12);box-shadow:0 0 56px rgba(0,212,255,.5)}}
.sk{height:14px;border-radius:7px;margin:.5rem 0;background:linear-gradient(90deg,rgba(148,163,184,.1),rgba(148,163,184,.25),rgba(148,163,184,.1));background-size:200%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200%}}
.mic{width:56px;height:56px;border-radius:50%;padding:0}.rec{outline:3px solid var(--bad)}
.row{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap}
.unit{display:flex;gap:.8rem;align-items:center;padding:.6rem 0;border-bottom:1px solid var(--ln)}.unit:last-child{border:0}.unit .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--ln);flex:none}
.unit.cur .dot{border-color:var(--c);box-shadow:0 0 14px rgba(0,212,255,.4)}.unit.done .dot{background:var(--ok);border-color:var(--ok)}.unit.lock{opacity:.5}

.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}.bgfx i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.34;animation:dr 22s ease-in-out infinite alternate}.bgfx i:nth-child(1){width:420px;height:420px;background:#4B8BFF;top:-140px;left:12%}.bgfx i:nth-child(2){width:380px;height:380px;background:#916BFF;right:-110px;top:32%;animation-duration:28s}.bgfx i:nth-child(3){width:320px;height:320px;background:#00D9FF;opacity:.2;bottom:-120px;left:40%;animation-duration:34s}@keyframes dr{to{transform:translate(90px,70px) scale(1.18)}}#ptc{position:absolute;inset:0;width:100%;height:100%}
body.noicon nav span{display:inline!important}
@media(max-width:760px){body{flex-direction:column-reverse}nav{width:100%;display:flex;overflow-x:auto;border:0;border-top:1px solid var(--ln);padding:.3rem}nav.col{width:100%}nav span,.lg{display:none!important}nav button{width:auto;padding:.6rem}main{padding:1rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* holographic layer */
.bgfx:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,transparent 30%,rgba(7,10,19,.6))}
.scene{position:absolute;inset:0;width:100%;height:100%;opacity:.5}.fg{animation:fg 9s ease-in-out infinite alternate;animation-delay:var(--d,0s)}@keyframes fg{to{transform:translateY(-16px)}}

.beam{position:absolute;top:-10%;width:170px;height:120%;background:linear-gradient(rgba(0,217,255,.13),transparent 75%);filter:blur(18px);transform:rotate(18deg)}
.card{animation:gi .4s both}@keyframes gi{from{opacity:0;transform:translateY(10px) scale(.98)}}
.card:hover{border-color:rgba(0,217,255,.28)}
body[data-env=gram] .scene,body[data-env=gram] .beam,body[data-env=gram] .floor{opacity:.12}
body[data-env=speak] .hs{transform:scale(1.2);margin:.8rem 0}body[data-env=speak] .mic{width:72px;height:72px}

/* top bar */
#wrap{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;z-index:1;height:100%}main{min-height:0}
#tb{display:flex;align-items:center;gap:.7rem;padding:.6rem 1.4rem;border-bottom:1px solid var(--ln);background:rgba(10,16,32,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}

.tlg{display:none;font:800 .95rem Manrope;letter-spacing:.05em;white-space:nowrap}

.av{width:34px;height:34px;border-radius:50%;border:1px solid rgba(0,217,255,.5);background:linear-gradient(135deg,var(--a),var(--p));color:#fff;font:700 .9rem Manrope;cursor:pointer}
/* floating gauges */
.orbit{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1rem;margin:1.2rem 0}
.fp{position:relative;display:grid;justify-items:center;text-align:center;gap:.15rem;padding:1rem .6rem;border-radius:22px;border:1px solid var(--ln);background:linear-gradient(135deg,rgba(255,255,255,.08),transparent 40%),rgba(18,30,55,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 18px 40px rgba(0,0,0,.35);animation:fq 7s ease-in-out infinite alternate;animation-delay:calc(var(--i)*-1.3s)}
.fp:hover{border-color:rgba(0,217,255,.35)}@keyframes fq{to{transform:translateY(-8px)}}

/* holographic tutor: animates only from real state */
.holo{display:grid;justify-items:center;gap:.4rem;margin:.4rem auto 1rem;--lv:0}
.hs{position:relative;width:170px;height:170px;display:grid;place-items:center}
.sp{width:104px;height:104px;border-radius:50%;background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.85),var(--c) 18%,var(--a) 48%,var(--p) 78%,#1a1040);box-shadow:0 0 30px rgba(75,139,255,.3),inset -10px -14px 28px rgba(0,0,0,.4);transform:scale(calc(1 + var(--lv)*.12));transition:transform .08s,box-shadow .08s,filter .3s}
.r{position:absolute;inset:6px;border-radius:50%;border:1.5px solid rgba(0,217,255,.4);border-top-color:var(--c);transform:rotateX(70deg)}.r2{inset:24px;border-color:rgba(145,107,255,.5);border-top-color:var(--p);transform:rotateX(70deg) rotateY(40deg)}

.holo[data-state=listening] .sp{box-shadow:0 0 calc(30px + var(--lv)*70px) rgba(0,217,255,.6)}.holo[data-state=listening] .r{border-color:rgba(0,217,255,.9)}
.holo[data-state=speaking] .sp{box-shadow:0 0 calc(30px + var(--lv)*70px) rgba(145,107,255,.65)}

.holo[data-state=processing] .r1{animation:sp1 1.6s linear infinite}.holo[data-state=processing] .r2{animation:sp2 2.4s linear infinite reverse}
@keyframes sp1{from{transform:rotateX(70deg) rotateZ(0)}to{transform:rotateX(70deg) rotateZ(360deg)}}@keyframes sp2{from{transform:rotateX(70deg) rotateY(40deg) rotateZ(0)}to{transform:rotateX(70deg) rotateY(40deg) rotateZ(360deg)}}
.wv{display:flex;gap:3px;align-items:center;justify-content:center;height:42px}.wv span{width:4px;height:3px;border-radius:2px;background:linear-gradient(var(--c),var(--p));transition:height .08s}
.hl{font-size:.85rem;color:var(--m);letter-spacing:.06em}
.mic.rec{outline:none;box-shadow:0 0 0 3px rgba(0,217,255,.5),0 0 24px rgba(0,217,255,.5)}
.office{height:84px;border-radius:14px;margin-bottom:.8rem;border:1px solid var(--ln);background:linear-gradient(180deg,rgba(75,139,255,.2),rgba(7,10,19,.1)),repeating-linear-gradient(90deg,transparent 0 78px,rgba(163,178,200,.16) 78px 80px);position:relative}.office:after{content:"Besprechungsraum · Büro Berlin";position:absolute;left:14px;bottom:8px;font-size:.78rem;color:var(--m);letter-spacing:.08em}
@media(max-width:760px){.tlg{display:block}#sq{max-width:120px}#tb{padding:.5rem .8rem}.scene,.beam{display:none}.fp,.fc,.fg{animation:none}.hs{transform:none!important}}

/* dashboard v2 */
nav{display:flex;flex-direction:column}.lg b{font-size:1rem;line-height:1.05;letter-spacing:.06em}.lg svg{flex:none}
.tag{font-size:.78rem;color:var(--c);padding:0 .6rem 1rem}nav.col .tag,nav.col .sb{display:none}

.promo{position:relative;overflow:hidden;border-radius:14px;border:1px solid rgba(0,217,255,.25);padding:.7rem;min-height:100px;background:linear-gradient(135deg,rgba(75,139,255,.25),rgba(145,107,255,.2));font-weight:700;font-size:.92rem}

.nb{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:9px;background:#ff3b5c;color:#fff;font-size:.68rem;display:grid;place-items:center}
.hero2{position:relative;border-radius:22px;border:1px solid rgba(0,217,255,.22);overflow:hidden;margin-bottom:1rem;display:grid;grid-template-columns:1.25fr 1fr;gap:1rem;padding:1.4rem;background:linear-gradient(180deg,rgba(12,19,48,.92),rgba(7,10,19,.88));box-shadow:0 0 50px rgba(75,139,255,.12)}
.hsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.hero2>*:not(.hsvg){position:relative;z-index:1}.px{transition:transform .3s ease-out}
.hero2 h1{font-size:2.3rem;margin-bottom:.2rem}.wave{display:inline-block;transform-origin:70% 70%;animation:wv2 2.6s ease-in-out infinite}@keyframes wv2{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}

.hrow{display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;flex:1;min-width:250px}

.tl b{display:block;font:800 1.35rem Manrope;line-height:1.1}.tl .l{font-size:.8rem;color:var(--m)}.ti{width:34px;height:34px;display:grid;place-items:center;color:var(--c)}.ti svg{width:26px;height:26px}

.cta:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:sh2 4s ease-in-out infinite}@keyframes sh2{0%,60%{left:-60%}100%{left:130%}}
.rg{stroke-dasharray:339.3;animation:rd 1.4s ease-out both}@keyframes rd{from{stroke-dashoffset:339.3}}

async function ev(){const c=cc();if(c.busy||c.log.length<3)return alert("Answer a few questions first.");c.busy=1;dc();hs("processing");try{const sample=await claude.use("sample"),h=c.log.filter(m=>m.r=="me"||m.r=="ai").map(m=>m.r=="me"?"Candidate: "+m.q:"Interviewer: "+m.de).join("\n"),r=await sample(`Evaluate this German interview practice transcript for a beginner. In English, give short sections: Grammar, Vocabulary, Fluency (from text only), Relevance, Top 3 corrections, Next steps. You received text only, so do not comment on pronunciation or claim to have heard audio. Be kind and specific; this is practice feedback, not a CEFR result.\n${h}`,{cache:false});c.log.push({r:"ev",t:r.text});act("Mock interview evaluated")}catch(e){c.log.push({r:"err",t:"Evaluation failed. Try again."})}finally{c.busy=0;if(HS=="processing")hs("idle");dc()}}
async function wfb(){const t=$("#wt").value.trim();if(!t)return;$("#wo").innerHTML='<div class="sk"></div><div class="sk"></div>';try{const sample=await claude.use("sample"),r=await sample(`A beginner learner wrote this German email. Task: ${$("#wp").value}. In English, give: 1) what works, 2) corrections with a short reason each, 3) register check (Sie, greeting, closing like Mit freundlichen Grüßen), 4) an improved version in German. Be kind and concise.\n\n${t}`,{cache:false});$("#wo").innerHTML=`<div class="card hot" style="white-space:pre-wrap;margin-top:1rem">${esc(r.text)}</div>`;mark(3);act("Writing feedback")}catch(e){$("#wo").innerHTML='<p class="bad">Couldn’t get feedback. Check permission or connection and try again.</p>'}}

(function(){const c=$("#ptc"),x=c.getContext("2d"),rm=matchMedia("(prefers-reduced-motion:reduce)").matches;let w,h,P=[];function rs(){w=c.width=innerWidth;h=c.height=innerHeight;const n=Math.min(70,Math.round(w*h/20000));P=Array.from({length:n},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,r:Math.random()*1.4+.6}));if(rm)f()}
